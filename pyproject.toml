[project]
name = "switchkit"
version = "0.1.4"
description = "Plex → Jellyfin migration tool. Dry-run first."
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
authors = [{name = "Switch Kit"}]
keywords = ["plex", "jellyfin", "migration", "media-server"]

dependencies = [
    "click>=8.1",
]

[project.scripts]
switchkit = "switchkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
